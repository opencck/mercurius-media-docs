[project]
name = "mercurius-media-docs"
version = "1.0.0"
description = "The text of office documents and PDF, and new docx, xlsx and pptx files, behind a small HTTP API; a module of the Mercurius agent"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["python-docx==1.1.2", "openpyxl==3.1.5", "python-pptx==1.0.2"]

[tool.ruff]
line-length = 160
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP", "S"]
ignore = ["S603", "S104", "S101", "S108"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S310", "S105", "S106"]
